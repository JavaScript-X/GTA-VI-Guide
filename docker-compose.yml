services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gta_guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gta_guide}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gta_guide} -d ${POSTGRES_DB:-gta_guide}"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gta-guide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/identity-service/src/server.mjs"]
    environment:
      IDENTITY_SERVICE_PORT: 8081
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-gta_guide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-gta_guide}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-minimum-32-bytes}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-minimum-32-bytes}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  game-profile-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/game-profile-service/src/server.mjs"]
    environment:
      GAME_PROFILE_SERVICE_PORT: 8082
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-gta_guide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-gta_guide}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  achievement-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/achievement-service/src/server.mjs"]
    environment:
      ACHIEVEMENT_SERVICE_PORT: 8083
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-gta_guide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-gta_guide}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  knowledge-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/knowledge-service/src/server.mjs"]
    environment:
      KNOWLEDGE_SERVICE_PORT: 8084
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-gta_guide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-gta_guide}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  community-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/community-service/src/server.mjs"]
    environment:
      COMMUNITY_SERVICE_PORT: 8085
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-gta_guide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-gta_guide}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/api-gateway/src/server.mjs"]
    environment:
      API_GATEWAY_PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      GAME_PROFILE_SERVICE_URL: http://game-profile-service:8082
      ACHIEVEMENT_SERVICE_URL: http://achievement-service:8083
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8084
      COMMUNITY_SERVICE_URL: http://community-service:8085
    depends_on:
      identity-service:
        condition: service_healthy
      game-profile-service:
        condition: service_healthy
      achievement-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      community-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  sync-worker:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "services/sync-worker/src/worker.mjs"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-gta-vi-guide-dev}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: ["node", "apps/web/server.mjs"]
    environment:
      WEB_PORT: 5173
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "infra/docker/healthcheck.mjs", "http://localhost:5173"]
      interval: 10s
      timeout: 3s
      retries: 5

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
