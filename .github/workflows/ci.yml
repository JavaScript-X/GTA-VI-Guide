name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run smoke test
        run: npm run smoke

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build service image
        run: docker build -f infra/docker/node-service.Dockerfile -t gta-vi-guide-platform:${{ github.sha }} .
