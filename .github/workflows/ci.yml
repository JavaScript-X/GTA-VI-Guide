name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: npm run build:web

      - name: Check syntax
        run: npm run check

      - name: Check database migrations
        run: npm run db:migration-check

      - name: Run tests
        run: npm test

      - name: Run smoke test
        run: npm run smoke

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build service image
        run: docker build -f infra/docker/node-service.Dockerfile -t gta-vi-guide-platform:${{ github.sha }} .

      - name: Security scan placeholder
        run: |
          echo "Add Trivy, Grype, Snyk, or registry-native image scanning here."

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-service.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/platform:${{ github.sha }}
            ghcr.io/${{ github.repository }}/platform:latest

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deployment hook placeholder
        run: echo "Call your Render/Railway/Fly/Kubernetes deployment hook here."
