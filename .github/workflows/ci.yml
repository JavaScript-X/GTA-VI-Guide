name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: npm run build:web

      - name: Check syntax
        run: npm run check

      - name: Check database migrations
        run: npm run db:migration-check

      - name: Run tests
        run: npm test

      - name: Run smoke test
        run: npm run smoke

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build service image
        run: docker build -f infra/docker/node-service.Dockerfile -t gta-vi-guide-platform:${{ github.sha }} .

      - name: Security scan placeholder
        run: |
          echo "Add Trivy, Grype, Snyk, or registry-native image scanning here."

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gta_guide
          POSTGRES_PASSWORD: gta_guide
          POSTGRES_DB: gta_guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gta_guide -d gta_guide"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gta_guide:gta_guide@localhost:5432/gta_guide
      RATE_LIMIT_MAX_REQUESTS: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        run: npm install

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations to PostgreSQL
        run: npm run db:migrate

      - name: Run smoke test against PostgreSQL adapter
        run: npm run smoke

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, postgres-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-service.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/platform:${{ github.sha }}
            ghcr.io/${{ github.repository }}/platform:latest

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deployment hook placeholder
        run: echo "Call your Render/Railway/Fly/Kubernetes deployment hook here."
